name: CI/CD Front-End

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.69.3   # versión verificada como segura tras el incidente de marzo de 2026

jobs:
  # ------------------------------------------------------------------ CI
  build-test-sonar:
    name: Tipos, pruebas, build y Sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificación de tipos (TypeScript estricto)
        run: npm run typecheck
      - name: Pruebas unitarias y de componentes + cobertura
        run: npm test
      - name: Build de producción
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - name: Análisis estático SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: >
          npx --yes @sonar/scan
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cobertura-frontend
          path: coverage

  trivy:
    name: Trivy - dependencias, secretos y configuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Escaneo de vulnerabilidades
        run: |
          docker run --rm -v "$PWD:/src" -w /src $TRIVY_IMAGE fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --format table --output trivy-fs.txt .
          cat trivy-fs.txt
          docker run --rm -v "$PWD:/src" -w /src $TRIVY_IMAGE fs \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 .
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trivy-frontend
          path: trivy-fs.txt

  # ------------------------------------------------------------------ CD
  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: [build-test-sonar, trivy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Disparar despliegue (deploy hook de Render)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Esperar a que el sitio responda
        run: |
          sleep 45
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.WEB_URL }}" || true)
            echo "Intento $i: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1

  e2e:
    name: Pruebas End-to-End sobre el ambiente publicado
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Despertar la API (Render free se duerme tras 15 min)
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null -w '%{http_code}\n' "${{ vars.API_URL }}/actuator/health" | grep -q 200 && exit 0
            sleep 10
          done
      - name: Escenario completo publicar Kudo (viewport móvil)
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.WEB_URL }}
          E2E_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reporte-e2e
          path: playwright-report
