# Reemplaza projectKey y organization con los de tu proyecto en SonarQube Cloud
# (también pueden llegar por variables del pipeline: SONAR_PROJECT_KEY / SONAR_ORGANIZATION).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/setupTests.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
